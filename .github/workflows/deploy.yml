name: 🚀 Build & Deploy to cPanel

on:
  push:
    branches:
      - main  # Trigger workflow ketika push ke branch main

jobs:
  deploy-frontend:
    name: 🌐 Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ---- BUILD FRONTEND ----
      - name: 🔨 Install & Build Frontend
        env:
          VITE_API_URL: https://filkommerch.com/api
          NITRO_PRESET: node-server
        run: |
          cd frontend
          npm install --include=dev
          npm run build

      # ---- CREATE RESTART TRIGGER & ENTRYPOINT ----
      - name: ⏱️ Create Restart File & Entrypoint
        run: |
          echo "import('./server/index.mjs');" > frontend/.output/app.js
          mkdir -p frontend/.output/tmp
          echo $(date) > frontend/.output/tmp/restart.txt

      # ---- DEPLOY FRONTEND VIA FTP ----
      - name: 📂 Deploy Frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/.output/
          server-dir: /frontend_app/
          timeout: 600000
          exclude: |
            node_modules
            node_modules/**
            **/node_modules
            **/node_modules/**
            **node_modules**

  deploy-backend:
    name: ⚙️ Deploy Backend
    needs: deploy-frontend
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # ---- BUILD BACKEND ----
      - name: 🔨 Install & Build Backend
        run: |
          cd backend
          npm install --include=dev
          npm run build

      # ---- CREATE RESTART TRIGGER ----
      - name: ⏱️ Create Restart File
        run: |
          mkdir -p backend/tmp
          echo $(date) > backend/tmp/restart.txt

      # ---- DEPLOY BACKEND VIA FTP ----
      - name: 📂 Deploy Backend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/
          server-dir: /backend_app/
          timeout: 600000
          exclude: |
            node_modules
            node_modules/**
            **/node_modules
            **/node_modules/**
            **node_modules**
            **/.git/**
            **/src/**
            **/.env*
            **/tsconfig.json
